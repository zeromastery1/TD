<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prismfall</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">Gathering shards…</div>

    <div id="hud-left" class="hud">
      <div class="lifebar"><div id="h-lifefill"></div><span id="h-lives">20 / 20</span></div>
      <div class="counters">
        <span class="coin"></span><span id="h-gold">0</span>
        <span class="skull">☠</span><span id="h-kills">0</span>
      </div>
      <button id="b-prospect" class="small" title="Raise the chance of drawing higher quality shards">Prospect</button>
    </div>

    <div id="hud-top" class="hud">
      <div id="h-wave">Wave 1</div>
      <div class="track"><div id="h-trackfill"></div><div id="h-marks"></div></div>
      <div id="next"></div>
    </div>

    <div id="hud-right" class="hud">
      <div class="speed">
        <button data-speed="1" class="on">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
      </div>
      <button id="b-recipes">Recipes</button>
      <button id="b-help">?</button>
    </div>

    <div id="phase"></div>
    <div id="toast"></div>

    <aside id="panel" class="hidden">
      <div id="p-title"></div>
      <div id="p-sub"></div>
      <div id="p-stats"></div>
      <div id="p-actions"></div>
    </aside>

    <div id="modal" class="hidden">
      <div class="card">
        <div id="m-body"></div>
        <div class="m-foot"><button id="m-close">Close</button></div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
